# render.yaml
databases:
  - name: producto-db
    databaseName: producto_crud
    user: producto_user
    plan: free

services:
  - type: web
    name: producto-crud-app
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn producto_crud.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: producto-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"